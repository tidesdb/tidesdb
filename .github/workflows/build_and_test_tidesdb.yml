name: TidesDB CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            arch: x64
          - os: ubuntu-latest
            name: Linux x86
            arch: x86
          - os: macos-latest
            name: macOS x64
            arch: x64
          - os: macos-latest
            name: macOS x86
            arch: x86
          - os: windows-latest
            name: Windows MSVC x64
            compiler: msvc
            arch: x64
          - os: windows-latest
            name: Windows MSVC x86
            compiler: msvc
            arch: x86
          - os: windows-latest
            name: Windows MinGW x64
            compiler: mingw
            arch: x64
          - os: windows-latest
            name: Windows MinGW x86
            compiler: mingw
            arch: x86
          - os: ubuntu-latest
            name: Linux PowerPC 32-bit
            arch: ppc
            compiler: gcc-powerpc
          - os: ubuntu-latest
            name: macOS 10.6.8 PowerPC G5
            arch: ppc-macos
            compiler: gcc-powerpc
            target_os: macos
          - os: ubuntu-latest
            name: Linux RISC-V 64-bit
            arch: riscv64
            compiler: gcc-riscv64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux x64)
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        run: |
          sudo apt update
          sudo apt install -y libzstd-dev liblz4-dev libsnappy-dev build-essential cmake pkg-config

      - name: Install dependencies (Linux x86)
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y gcc-multilib g++-multilib libc6-dev-i386 \
            libzstd-dev:i386 liblz4-dev:i386 libsnappy-dev:i386 build-essential cmake pkg-config

      - name: Install dependencies (Linux PowerPC)
        if: runner.os == 'Linux' && matrix.arch == 'ppc'
        run: |
          sudo apt update
          sudo apt install -y \
            crossbuild-essential-powerpc \
            gcc-powerpc-linux-gnu \
            g++-powerpc-linux-gnu \
            qemu-user-static \
            build-essential cmake pkg-config \
            git wget

          mkdir -p /tmp/ppc-deps
          cd /tmp/ppc-deps

          wget https://github.com/lz4/lz4/archive/refs/tags/v1.9.4.tar.gz -O lz4.tar.gz
          tar xzf lz4.tar.gz
          cd lz4-1.9.4
          make CC=powerpc-linux-gnu-gcc lib
          sudo make CC=powerpc-linux-gnu-gcc PREFIX=/usr/powerpc-linux-gnu install
          cd ..

          wget https://github.com/facebook/zstd/releases/download/v1.5.5/zstd-1.5.5.tar.gz
          tar xzf zstd-1.5.5.tar.gz
          cd zstd-1.5.5
          make CC=powerpc-linux-gnu-gcc lib
          sudo make CC=powerpc-linux-gnu-gcc PREFIX=/usr/powerpc-linux-gnu install
          cd ..

          wget https://github.com/google/snappy/archive/refs/tags/1.1.10.tar.gz -O snappy.tar.gz
          tar xzf snappy.tar.gz
          cd snappy-1.1.10
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=powerpc \
            -DCMAKE_C_COMPILER=powerpc-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=powerpc-linux-gnu-g++ \
            -DCMAKE_INSTALL_PREFIX=/usr/powerpc-linux-gnu \
            -DSNAPPY_BUILD_TESTS=OFF \
            -DSNAPPY_BUILD_BENCHMARKS=OFF
          cmake --build build
          sudo cmake --install build

      - name: Install dependencies (Linux RISC-V 64-bit)
        if: runner.os == 'Linux' && matrix.arch == 'riscv64'
        run: |
          # cmake, build-essential, pkg-config, git and wget ship on the runner image;
          # only the cross toolchain and qemu need installing. retries plus a per-connection
          # timeout keep a slow or stalling apt mirror from hanging the job indefinitely.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            crossbuild-essential-riscv64 \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            qemu-user-static

          mkdir -p /tmp/riscv64-deps
          cd /tmp/riscv64-deps

          wget https://github.com/lz4/lz4/archive/refs/tags/v1.9.4.tar.gz -O lz4.tar.gz
          tar xzf lz4.tar.gz
          cd lz4-1.9.4
          make CC=riscv64-linux-gnu-gcc lib
          sudo make CC=riscv64-linux-gnu-gcc PREFIX=/usr/riscv64-linux-gnu install
          cd ..

          wget https://github.com/facebook/zstd/releases/download/v1.5.5/zstd-1.5.5.tar.gz
          tar xzf zstd-1.5.5.tar.gz
          cd zstd-1.5.5
          make CC=riscv64-linux-gnu-gcc lib
          sudo make CC=riscv64-linux-gnu-gcc PREFIX=/usr/riscv64-linux-gnu install
          cd ..

          wget https://github.com/google/snappy/archive/refs/tags/1.1.10.tar.gz -O snappy.tar.gz
          tar xzf snappy.tar.gz
          cd snappy-1.1.10
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=riscv64 \
            -DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=riscv64-linux-gnu-g++ \
            -DCMAKE_INSTALL_PREFIX=/usr/riscv64-linux-gnu \
            -DSNAPPY_BUILD_TESTS=OFF \
            -DSNAPPY_BUILD_BENCHMARKS=OFF
          cmake --build build
          sudo cmake --install build

      - name: Install dependencies (macOS PowerPC cross-compile)
        if: runner.os == 'Linux' && matrix.arch == 'ppc-macos'
        run: |
          sudo apt update
          sudo apt install -y \
            crossbuild-essential-powerpc \
            gcc-powerpc-linux-gnu \
            g++-powerpc-linux-gnu \
            qemu-user-static \
            build-essential cmake pkg-config \
            git wget

          mkdir -p /tmp/ppc-deps
          cd /tmp/ppc-deps

          wget https://github.com/lz4/lz4/archive/refs/tags/v1.9.4.tar.gz -O lz4.tar.gz
          tar xzf lz4.tar.gz
          cd lz4-1.9.4
          make CC=powerpc-linux-gnu-gcc lib
          sudo make CC=powerpc-linux-gnu-gcc PREFIX=/usr/powerpc-linux-gnu install
          cd ..

          wget https://github.com/facebook/zstd/releases/download/v1.5.5/zstd-1.5.5.tar.gz
          tar xzf zstd-1.5.5.tar.gz
          cd zstd-1.5.5
          make CC=powerpc-linux-gnu-gcc lib
          sudo make CC=powerpc-linux-gnu-gcc PREFIX=/usr/powerpc-linux-gnu install
          cd ..

          wget https://github.com/google/snappy/archive/refs/tags/1.1.10.tar.gz -O snappy.tar.gz
          tar xzf snappy.tar.gz
          cd snappy-1.1.10
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=powerpc \
            -DCMAKE_C_COMPILER=powerpc-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=powerpc-linux-gnu-g++ \
            -DCMAKE_INSTALL_PREFIX=/usr/powerpc-linux-gnu \
            -DSNAPPY_BUILD_TESTS=OFF \
            -DSNAPPY_BUILD_BENCHMARKS=OFF
          cmake --build build
          sudo cmake --install build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install zstd lz4 snappy

      - name: Setup vcpkg binary cache (Windows MSVC)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:GITHUB_WORKSPACE\vcpkg_cache"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
          echo "VCPKG_DEFAULT_BINARY_CACHE=$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg packages (Windows MSVC)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ matrix.compiler }}-${{ matrix.arch }}-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ matrix.compiler }}-${{ matrix.arch }}-
            vcpkg-${{ matrix.compiler }}-

      - name: Install dependencies (Windows MSVC x64)
        if: matrix.compiler == 'msvc' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          cd $env:VCPKG_INSTALLATION_ROOT
          git pull
          .\vcpkg.exe install zstd:x64-windows snappy:x64-windows lz4:x64-windows pthreads:x64-windows

      - name: Install dependencies (Windows MSVC x86)
        if: matrix.compiler == 'msvc' && matrix.arch == 'x86'
        shell: pwsh
        run: |
          cd $env:VCPKG_INSTALLATION_ROOT
          git pull
          .\vcpkg.exe install zstd:x86-windows snappy:x86-windows lz4:x86-windows pthreads:x86-windows

      - name: Setup MSYS2 (MinGW)
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.arch == 'x86' && 'MINGW32' || 'MINGW64' }}
          update: false
          # propagate /mingw{32,64}/bin onto the runner's Windows PATH so
          # subsequent bash/pwsh steps (notably `ctest`) can locate the
          # compression DLLs at runtime; without this we hit STATUS_DLL_NOT_FOUND.
          path-type: inherit
          # snappy is built from source for both arches in the next step (see
          # there for why), so MSYS2's prebuilt snappy package is not installed.
          install: ${{ matrix.arch == 'x86' && 'git mingw-w64-i686-gcc mingw-w64-i686-cmake mingw-w64-i686-make mingw-w64-i686-pkgconf mingw-w64-i686-zstd mingw-w64-i686-lz4' || 'git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zstd mingw-w64-x86_64-lz4' }}

      - name: Build snappy from source (MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          # Build snappy 1.2.2 from source for both arches so the two legs use
          # an identical snappy: shared libsnappy.dll plus SnappyConfig.cmake
          # pointing at the shared variant. MSYS2 dropped mingw-w64-i686-snappy
          # in Oct 2024 (no x86 package at all), and its prebuilt x64 package
          # ships only the static C++ archive which fails to link from our
          # C-only test exes. Building ourselves keeps both legs consistent.
          git clone --depth 1 --branch 1.2.2 https://github.com/google/snappy.git /tmp/snappy
          cd /tmp/snappy
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX" \
            -DSNAPPY_BUILD_TESTS=OFF \
            -DSNAPPY_BUILD_BENCHMARKS=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build build --config Release
          cmake --install build

      - name: Configure CMake (Linux/macOS x64)
        if: runner.os != 'Windows' && matrix.arch == 'x64'
        shell: bash
        run: cmake -S . -B build -DTIDESDB_BUILD_TESTS=ON -DTIDESDB_WITH_SANITIZER=ON

      - name: Lint -Wmaybe-uninitialized (Linux x64 GCC, optimized)
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        shell: bash
        run: |
          # -Wmaybe-uninitialized only fires under optimization, so use a dedicated
          # RelWithDebInfo build with the TIDESDB_WARN_MAYBE_UNINIT cmake option (the main
          # sanitizer build above is -O0, where the analysis is a no-op). this build is
          # isolated in build-wmu and does not affect the sanitizer build. the gate fails
          # only on warnings in our own src/; third-party external/ is build-only.
          cmake -S . -B build-wmu -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTIDESDB_BUILD_TESTS=ON -DTIDESDB_WARN_MAYBE_UNINIT=ON
          cmake --build build-wmu -j"$(nproc)" 2>&1 | tee build-wmu.log
          if grep -E '\[-Wmaybe-uninitialized\]' build-wmu.log | grep '/src/'; then
            echo "::error::-Wmaybe-uninitialized reported a warning in src/"
            exit 1
          fi
          echo "no -Wmaybe-uninitialized warnings in src/"

      - name: Allocation-failure sweep (Linux x64 GCC)
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        shell: bash
        run: |
          # refuse the nth allocation and walk n across a workload, which is the only way an
          # out-of-memory unwind gets exercised at all -- every one of these paths is unreachable
          # from an ordinary run. isolated in build-af rather than folded into the sanitizer build
          # above, because the injector wraps malloc at link time and asan interposes on it at
          # runtime, and because the sweeps are slow enough to be worth their own step.
          cmake -S . -B build-af -DCMAKE_BUILD_TYPE=Debug \
            -DTIDESDB_BUILD_TESTS=ON -DTIDESDB_WITH_ALLOC_FAULT=ON
          cmake --build build-af -j"$(nproc)" --target alloc_fault_tests
          ./build-af/alloc_fault_tests

      - name: Configure CMake (Linux x86)
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        shell: bash
        run: |
          export PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig
          cmake -S . -B build \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32 -L/usr/lib/i386-linux-gnu" \
            -DCMAKE_SHARED_LINKER_FLAGS="-m32 -L/usr/lib/i386-linux-gnu" \
            -DCMAKE_MODULE_LINKER_FLAGS="-m32 -L/usr/lib/i386-linux-gnu" \
            -DTIDESDB_BUILD_TESTS=ON \
            -DTIDESDB_WITH_SANITIZER=ON

      - name: Configure CMake (Linux PowerPC)
        if: runner.os == 'Linux' && matrix.arch == 'ppc'
        shell: bash
        run: |
          export PKG_CONFIG_PATH=/usr/powerpc-linux-gnu/lib/pkgconfig
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=powerpc \
            -DCMAKE_C_COMPILER=powerpc-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=powerpc-linux-gnu-g++ \
            -DCMAKE_C_FLAGS="-mlongcall" \
            -DCMAKE_FIND_ROOT_PATH=/usr/powerpc-linux-gnu \
            -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-ppc-static;-L;/usr/powerpc-linux-gnu" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_EXE_LINKER_FLAGS="-L/usr/powerpc-linux-gnu/lib -L/usr/lib/powerpc-linux-gnu" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L/usr/powerpc-linux-gnu/lib -L/usr/lib/powerpc-linux-gnu" \
            -DCMAKE_MODULE_LINKER_FLAGS="-L/usr/powerpc-linux-gnu/lib -L/usr/lib/powerpc-linux-gnu" \
            -DTIDESDB_BUILD_TESTS=ON \
            -DTIDESDB_WITH_SANITIZER=OFF

      - name: Configure CMake (Linux RISC-V 64-bit)
        if: runner.os == 'Linux' && matrix.arch == 'riscv64'
        shell: bash
        run: |
          export PKG_CONFIG_PATH=/usr/riscv64-linux-gnu/lib/pkgconfig
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=riscv64 \
            -DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=riscv64-linux-gnu-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/riscv64-linux-gnu \
            -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-riscv64-static;-L;/usr/riscv64-linux-gnu" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_EXE_LINKER_FLAGS="-L/usr/riscv64-linux-gnu/lib -L/usr/lib/riscv64-linux-gnu" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L/usr/riscv64-linux-gnu/lib -L/usr/lib/riscv64-linux-gnu" \
            -DCMAKE_MODULE_LINKER_FLAGS="-L/usr/riscv64-linux-gnu/lib -L/usr/lib/riscv64-linux-gnu" \
            -DTIDESDB_BUILD_TESTS=ON \
            -DTIDESDB_WITH_SANITIZER=OFF

      - name: Configure CMake (macOS PowerPC cross-compile)
        if: runner.os == 'Linux' && matrix.arch == 'ppc-macos'
        shell: bash
        run: |
          export PKG_CONFIG_PATH=/usr/powerpc-linux-gnu/lib/pkgconfig
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=powerpc \
            -DCMAKE_C_COMPILER=powerpc-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=powerpc-linux-gnu-g++ \
            -DCMAKE_C_FLAGS="-mlongcall" \
            -DCMAKE_FIND_ROOT_PATH=/usr/powerpc-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_EXE_LINKER_FLAGS="-L/usr/powerpc-linux-gnu/lib -L/usr/lib/powerpc-linux-gnu" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L/usr/powerpc-linux-gnu/lib -L/usr/lib/powerpc-linux-gnu" \
            -DCMAKE_MODULE_LINKER_FLAGS="-L/usr/powerpc-linux-gnu/lib -L/usr/lib/powerpc-linux-gnu" \
            -DUSE_HOMEBREW=OFF \
            -DTIDESDB_BUILD_TESTS=ON \
            -DTIDESDB_WITH_SANITIZER=OFF

      - name: Configure CMake (macOS x86)
        if: runner.os == 'macOS' && matrix.arch == 'x86'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32" \
            -DCMAKE_SHARED_LINKER_FLAGS="-m32" \
            -DCMAKE_MODULE_LINKER_FLAGS="-m32" \
            -DTIDESDB_BUILD_TESTS=ON \
            -DTIDESDB_WITH_SANITIZER=ON

      # NOTE: TIDESDB_WITH_SANITIZER on Windows only adds extra warning flags;
      # neither MSVC nor MinGW gates real ASan/UBSan on it (see CMakeLists.txt:66-103).
      # Keep it OFF on Windows to avoid the noise.
      - name: Configure CMake (Windows MSVC x64)
        if: matrix.compiler == 'msvc' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DTIDESDB_BUILD_TESTS=ON -DTIDESDB_WITH_SANITIZER=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure CMake (Windows MSVC x86)
        if: matrix.compiler == 'msvc' && matrix.arch == 'x86'
        shell: pwsh
        run: |
          cmake -S . -B build -A Win32 -DTIDESDB_BUILD_TESTS=ON -DTIDESDB_WITH_SANITIZER=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure CMake (Windows MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" \
            -DTIDESDB_BUILD_TESTS=ON \
            -DTIDESDB_WITH_SANITIZER=OFF

      - name: Build (MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: cmake --build build --config Release

      - name: Build
        if: matrix.compiler != 'mingw'
        run: cmake --build build --config Release

      - name: Run tests
        shell: bash
        run: |
          cd build
          if [ "${{ matrix.arch }}" == "ppc" ]; then
            # ctest drives each binary through qemu-user via CMAKE_CROSSCOMPILING_EMULATOR. older
            # qemu segfaulted on PowerPC pthread mutex internals and lwsync barrier translation, so
            # this lane stays best effort -- but it reports loudly rather than silently, and a
            # failure here is a signal to look rather than something to ignore
            if ctest --output-on-failure --timeout 1800 --build-config Release; then
              echo "PowerPC 32-bit: all tests passed under qemu"
            else
              echo "::warning::PowerPC 32-bit tests failed under qemu emulation -- see log above."
              echo "::warning::build verification still valid; investigate before assuming emulation."
            fi
          elif [ "${{ matrix.arch }}" == "ppc-macos" ]; then
            # the cross-build emits Mach-O PowerPC binaries targeting Mac OS X 10.6.8, which Linux
            # cannot execute -- Darling has no PowerPC support and booting an OS X PowerPC VM per
            # job is impractical. build verification is the realistic ceiling here
            echo "macOS PowerPC (G5): build verified, no execution path on a Linux runner"
          elif [ "${{ matrix.arch }}" == "riscv64" ]; then
            # ctest runs each binary through the emulator command, which carries -L to the sysroot
            # holding the riscv loader. a test that re-execs itself does not go through that command
            # -- the kernel hands the exec to qemu through binfmt, which has no -L and looks for the
            # loader under the host's own /lib, where there is none. QEMU_LD_PREFIX is the same
            # setting by another name and binfmt-invoked qemu reads it, so the child resolves its
            # loader the way its parent already does
            export QEMU_LD_PREFIX=/usr/riscv64-linux-gnu
            # emulation is reliable enough here that a failure is treated as a real failure
            ctest --output-on-failure --timeout 5400 --build-config Release
          else
            if [ "${{ matrix.arch }}" == "x86" ]; then
              # the 32-bit address space is only ~3 GiB, and ASan's own bookkeeping (per-thread
              # FakeStack, redzones, the freed-allocation quarantine) claims most of it across a
              # long suite. cap that overhead so the many-thread tests have room, keeping this
              # lane's detection while the x86-64 ASan job runs the defaults
              export ASAN_OPTIONS="detect_stack_use_after_return=0:quarantine_size_mb=64:max_redzone=256:allocator_release_to_os_interval_ms=0"
            fi
            ctest --output-on-failure --timeout 5400 --build-config Release
          fi

  create-portable-db:
    runs-on: ubuntu-latest
    needs: build-and-test
    name: Create Portable Test Database (x64 Linux)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libzstd-dev liblz4-dev libsnappy-dev build-essential cmake
      
      - name: Build TidesDB
        run: |
          cmake -S . -B build
          cmake --build build --config Release
      
      - name: Create test database
        run: |
          TIDESDB_PORTABLE_DIR=./build/testdb ./build/portable_db_create

      - name: Verify database contents before upload
        run: |
          echo "=== database directory structure ==="
          ls -laR build/testdb/
          echo ""
          # a v10 database is a db-level MANIFEST and value log plus per-family klogs and the
          # wal. the value log is segmented, so it is one NNNNNNN.vlog file per segment rather
          # than a single one named VLOG -- naming that under bash -e fails the whole step
          echo "=== manifest and value log ==="
          ls -l build/testdb/MANIFEST
          ls -l build/testdb/*.vlog
          echo ""
          echo "=== key logs ==="
          find build/testdb -name "*.klog" | head -20
          echo ""
          # the artifact is only meaningful if a flush actually produced sstables
          if [ -z "$(find build/testdb -name '*.klog' -print -quit)" ]; then
            echo "::error::no klog files -- the artifact would not exercise the sstable format"
            exit 1
          fi

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: portable-db
          path: build/testdb/
          retention-days: 1

  verify-portable-db:
    runs-on: ${{ matrix.os }}
    needs: create-portable-db
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows MSVC x64
            compiler: msvc
            arch: x64
          - os: windows-latest
            name: Windows MSVC x86
            compiler: msvc
            arch: x86
          - os: windows-latest
            name: Windows MinGW x64
            compiler: mingw
            arch: x64
          - os: windows-latest
            name: Windows MinGW x86
            compiler: mingw
            arch: x86
          - os: macos-latest
            name: macOS x64
            arch: x64
          - os: macos-latest
            name: macOS x86
            arch: x86
          - os: ubuntu-latest
            name: Linux x86
            arch: x86
    
    name: Test portability on ${{ matrix.name }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download database
        uses: actions/download-artifact@v4
        with:
          name: portable-db
          path: testdb

      - name: Verify downloaded database contents
        shell: bash
        run: |
          echo "=== downloaded database structure ==="
          ls -laR testdb/
          echo ""
          # a v10 database is a db-level MANIFEST and value log plus per-family klogs and the
          # wal. the value log is segmented, so it is one NNNNNNN.vlog file per segment rather
          # than a single one named VLOG -- naming that under bash -e fails the whole step
          echo "=== manifest and value log ==="
          ls -l testdb/MANIFEST
          ls -l testdb/*.vlog
          echo ""
          echo "=== key logs ==="
          find testdb -name "*.klog" | head -20
          echo ""
          echo "=== write-ahead logs ==="
          find testdb -name "*.log" | head -20

      - name: Install dependencies (Linux x86)
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y gcc-multilib g++-multilib libc6-dev-i386 \
            libzstd-dev:i386 liblz4-dev:i386 libsnappy-dev:i386 build-essential cmake pkg-config
      
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd lz4 snappy
      
      - name: Setup vcpkg binary cache (Windows MSVC)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:GITHUB_WORKSPACE\vcpkg_cache"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
          echo "VCPKG_DEFAULT_BINARY_CACHE=$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg packages (Windows MSVC)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-verify-${{ matrix.compiler }}-${{ matrix.arch }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-verify-${{ matrix.compiler }}-${{ matrix.arch }}-
            vcpkg-${{ matrix.compiler }}-${{ matrix.arch }}-

      - name: Install dependencies (Windows MSVC x64)
        if: matrix.compiler == 'msvc' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          cd $env:VCPKG_INSTALLATION_ROOT
          .\vcpkg.exe install zstd:x64-windows snappy:x64-windows lz4:x64-windows pthreads:x64-windows

      - name: Install dependencies (Windows MSVC x86)
        if: matrix.compiler == 'msvc' && matrix.arch == 'x86'
        shell: pwsh
        run: |
          cd $env:VCPKG_INSTALLATION_ROOT
          .\vcpkg.exe install zstd:x86-windows snappy:x86-windows lz4:x86-windows pthreads:x86-windows

      - name: Setup MSYS2 (MinGW)
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.arch == 'x86' && 'MINGW32' || 'MINGW64' }}
          update: false
          # propagate /mingw{32,64}/bin onto the runner's Windows PATH so
          # subsequent bash/pwsh steps (notably `ctest`) can locate the
          # compression DLLs at runtime; without this we hit STATUS_DLL_NOT_FOUND.
          path-type: inherit
          # snappy is built from source for both arches in the next step (see
          # there for why), so MSYS2's prebuilt snappy package is not installed.
          install: ${{ matrix.arch == 'x86' && 'git mingw-w64-i686-gcc mingw-w64-i686-cmake mingw-w64-i686-make mingw-w64-i686-pkgconf mingw-w64-i686-zstd mingw-w64-i686-lz4' || 'git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zstd mingw-w64-x86_64-lz4' }}

      - name: Build snappy from source (MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          # Build snappy 1.2.2 from source for both arches so the two legs use
          # an identical snappy: shared libsnappy.dll plus SnappyConfig.cmake
          # pointing at the shared variant. MSYS2 dropped mingw-w64-i686-snappy
          # in Oct 2024 (no x86 package at all), and its prebuilt x64 package
          # ships only the static C++ archive which fails to link from our
          # C-only test exes. Building ourselves keeps both legs consistent.
          git clone --depth 1 --branch 1.2.2 https://github.com/google/snappy.git /tmp/snappy
          cd /tmp/snappy
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX" \
            -DSNAPPY_BUILD_TESTS=OFF \
            -DSNAPPY_BUILD_BENCHMARKS=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build build --config Release
          cmake --install build
      
      - name: Build TidesDB (Windows MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DTIDESDB_WITH_SANITIZER=OFF
          cmake --build build --config Release

      - name: Build TidesDB
        if: matrix.compiler != 'mingw'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            if [ "${{ matrix.arch }}" == "x86" ]; then
              cmake -S . -B build -A Win32 -DTIDESDB_WITH_SANITIZER=OFF -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            else
              cmake -S . -B build -A x64 -DTIDESDB_WITH_SANITIZER=OFF -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            fi
          elif [ "$RUNNER_OS" == "Linux" ]; then
            export PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig
            cmake -S . -B build \
              -DCMAKE_C_FLAGS="-m32" \
              -DCMAKE_EXE_LINKER_FLAGS="-m32 -L/usr/lib/i386-linux-gnu" \
              -DCMAKE_SHARED_LINKER_FLAGS="-m32 -L/usr/lib/i386-linux-gnu" \
              -DCMAKE_MODULE_LINKER_FLAGS="-m32 -L/usr/lib/i386-linux-gnu" \
              -DTIDESDB_WITH_SANITIZER=OFF
          else
            cmake -S . -B build
          fi
          cmake --build build --config Release

      # MinGW path runs under msys2 shell so cmake/cc.exe see the MSYS2 env;
      # using system cmake from Git Bash invokes mingw32-cc.exe without its
      # environment and the trial compile fails with no useful output.
      - name: Verify database (Windows MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          TIDESDB_PORTABLE_DIR=./testdb ./build/portable_db_verify.exe

      # msvc is a multi-config generator, so it puts the binary under the configuration directory
      # rather than beside the build tree the single-config generators use, and names it with the
      # executable suffix. the generic step below is right for the platforms that build with one
      - name: Verify database (Windows MSVC)
        if: matrix.compiler == 'msvc'
        shell: bash
        run: |
          TIDESDB_PORTABLE_DIR=./testdb ./build/Release/portable_db_verify.exe

      - name: Verify database
        if: matrix.compiler != 'mingw' && matrix.compiler != 'msvc'
        shell: bash
        run: |
          TIDESDB_PORTABLE_DIR=./testdb ./build/portable_db_verify

  build-with-mimalloc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64 (mimalloc)
            arch: x64
          - os: macos-latest
            name: macOS x64 (mimalloc)
            arch: x64
          - os: windows-latest
            name: Windows MSVC x64 (mimalloc)
            compiler: msvc
            arch: x64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux x64)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libzstd-dev liblz4-dev libsnappy-dev libmimalloc-dev build-essential cmake pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install zstd lz4 snappy mimalloc

      - name: Setup vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:GITHUB_WORKSPACE\vcpkg_cache"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
          echo "VCPKG_DEFAULT_BINARY_CACHE=$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-mimalloc-${{ matrix.compiler }}-${{ matrix.arch }}-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-mimalloc-${{ matrix.compiler }}-${{ matrix.arch }}-
            vcpkg-${{ matrix.compiler }}-${{ matrix.arch }}-

      - name: Install dependencies (Windows MSVC x64)
        if: matrix.compiler == 'msvc' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          cd $env:VCPKG_INSTALLATION_ROOT
          git pull
          .\vcpkg.exe install zstd:x64-windows snappy:x64-windows lz4:x64-windows pthreads:x64-windows mimalloc:x64-windows

      - name: Configure CMake (Linux/macOS x64)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake -S . -B build -DTIDESDB_BUILD_TESTS=ON -DTIDESDB_WITH_SANITIZER=OFF -DTIDESDB_WITH_MIMALLOC=ON

      - name: Configure CMake (Windows MSVC x64)
        if: matrix.compiler == 'msvc' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DTIDESDB_BUILD_TESTS=ON -DTIDESDB_WITH_SANITIZER=OFF -DTIDESDB_WITH_MIMALLOC=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        shell: bash
        run: |
          cd build
          ctest -V --output-on-failure --timeout 5400 --build-config Release

  build-with-tcmalloc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64 (tcmalloc)
            arch: x64
          - os: macos-latest
            name: macOS x64 (tcmalloc)
            arch: x64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux x64)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libzstd-dev liblz4-dev libsnappy-dev libgoogle-perftools-dev build-essential cmake pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install zstd lz4 snappy gperftools

      - name: Configure CMake
        run: cmake -S . -B build -DTIDESDB_BUILD_TESTS=ON -DTIDESDB_WITH_SANITIZER=OFF -DTIDESDB_WITH_TCMALLOC=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        shell: bash
        run: |
          cd build
          ctest -V --output-on-failure --timeout 5400 --build-config Release

  build-and-test-oracle-linux:
    runs-on: ubuntu-latest
    name: Oracle Linux 8 x64
    container:
      image: oraclelinux:8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y oracle-epel-release-el8
          dnf install -y gcc gcc-c++ make cmake git \
            libzstd-devel lz4-devel libatomic \
            diffutils wget

          # snappy-devel is not available in OL8 repos, build from source
          cd /tmp
          wget https://github.com/google/snappy/archive/refs/tags/1.1.10.tar.gz -O snappy.tar.gz
          tar xzf snappy.tar.gz
          cd snappy-1.1.10
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSNAPPY_BUILD_TESTS=OFF \
            -DSNAPPY_BUILD_BENCHMARKS=OFF
          cmake --build build
          cmake --install build

      - name: Configure CMake
        run: cmake -S . -B build -DTIDESDB_BUILD_TESTS=ON -DTIDESDB_WITH_SANITIZER=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest -V --output-on-failure --timeout 5400 --build-config Release

  fuzz:
    runs-on: ubuntu-latest
    name: Fuzz harnesses
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libzstd-dev liblz4-dev libsnappy-dev build-essential cmake pkg-config

      - name: Configure CMake
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTIDESDB_BUILD_FUZZERS=ON

      - name: Build
        run: cmake --build build-fuzz -j

      - name: Run the model-based harnesses
        shell: bash
        env:
          # a fresh seed per run explores new ground, and every harness prints its seed on
          # failure so any hit here reproduces exactly
          TIDESDB_FUZZ_SEED: ${{ github.run_number }}
        run: |
          set -e
          run_fuzzer() {
            local name=$1 iters=$2
            echo "::group::$name ($iters iterations, seed $TIDESDB_FUZZ_SEED)"
            rm -rf "fuzzdir-$name" && mkdir -p "fuzzdir-$name"
            TIDESDB_FUZZ_ITERS=$iters TIDESDB_FUZZ_DIR="fuzzdir-$name" "./build-fuzz/$name"
            echo "::endgroup::"
          }
          # the decoders are cheap and branch heavily on input bytes, so they get far more passes
          run_fuzzer fuzz_decode 5000
          run_fuzzer fuzz_standalone 300
          run_fuzzer fuzz_crash 300
          run_fuzzer fuzz_conc 300

  build-and-test-tsan:
    runs-on: ubuntu-latest
    name: Linux x64 ThreadSanitizer
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libzstd-dev liblz4-dev libsnappy-dev build-essential cmake pkg-config

      - name: Configure CMake
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTIDESDB_BUILD_TESTS=ON -DTIDESDB_WITH_TSAN=ON

      - name: Build
        run: cmake --build build-tsan -j

      # the x64 lane above runs the same suite under ASan; the two sanitizers cannot be combined,
      # so the data races this catches have no other lane that would find them
      - name: Run tests
        working-directory: build-tsan
        run: ctest --output-on-failure --timeout 5400

  zero-warnings:
    runs-on: ubuntu-latest
    name: Zero warnings (library, tests, fuzzers, bench)
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libzstd-dev liblz4-dev libsnappy-dev build-essential cmake pkg-config

      # -Wall -Wextra are always on, but nothing makes them fatal, so a warning can accumulate
      # unnoticed. this lane is the only thing that fails on one. it also covers the bench driver
      # and the fuzz harnesses, which no other job compiles at all
      - name: Configure CMake with warnings as errors
        run: |
          cmake -S . -B build-werror -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTIDESDB_BUILD_TESTS=ON \
            -DTIDESDB_BUILD_BENCH=ON \
            -DTIDESDB_BUILD_FUZZERS=ON \
            -DCMAKE_C_FLAGS="-Werror"

      - name: Build everything
        run: cmake --build build-werror -j

      # linking is not enough -- run a tiny workload so a driver that builds but cannot open a
      # database, or that regressed a workload, fails here
      - name: Smoke test the bench driver
        run: |
          mkdir -p bench-smoke
          ./build-werror/tidesdb_bench --benchmarks=fillrandom,readrandom \
            --threads=2 --num=2000 --value_size=256 --dir=bench-smoke
