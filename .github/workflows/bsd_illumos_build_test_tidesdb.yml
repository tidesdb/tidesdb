name: BSD and Illumos TidesDB Build & Test

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
# tests on FreeBsd, OpenBsd, NetBsd, OmniOS (Illumos), and DragonFlyBSD
jobs:
  freebsd-build:
    runs-on: ubuntu-latest
    name: FreeBSD 15.0 x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            # the freebsd 15.0 image's FreeBSD-ports repo has been intermittently
            # returning a truncated signature_fingerprints reply, leaving pkg unable
            # to open the repo for installs. patch the existing repo definitions in
            # place to disable signature checking; pkg still verifies each package's
            # SHA256 from the package metadata, so package integrity is preserved.
            # 15.0 splits the legacy FreeBSD repo into FreeBSD-ports, FreeBSD-ports-kmods,
            # and FreeBSD-base, all defined in /etc/pkg/FreeBSD.conf -- one sed catches
            # all of them. -i '' is bsd sed syntax (empty backup extension).
            sed -i '' -E 's/signature_type:[[:space:]]*"?fingerprints"?/signature_type: "none"/g' \
              /etc/pkg/FreeBSD.conf
            rm -rf /var/db/pkg/repos/*
            pkg update -f
            pkg install -y cmake pkgconf liblz4 zstd snappy
          run: |
            echo "*=====================================*"
            echo " System Information"
            echo "*=====================================*"
            uname -a
            freebsd-version

            echo ""
            echo "*=====================================*"
            echo " Configure CMake"
            echo "*=====================================*"
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/libdata/pkgconfig
            cmake -S . -B build \
              -DTIDESDB_BUILD_TESTS=ON \
              -DTIDESDB_WITH_SANITIZER=ON

            echo ""
            echo "*=====================================*"
            echo " Build"
            echo "*=====================================*"
            cmake --build build --config Release

            echo ""
            echo "*=====================================*"
            echo " Run Tests"
            echo "*=====================================*"
            cd build
            ctest -V --output-on-failure --timeout 5400 --build-config Release

  openbsd-build:
    runs-on: ubuntu-latest
    name: OpenBSD 7.8 x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.8"
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            export PKG_PATH=http://ftp.openbsd.org/pub/OpenBSD/7.8/packages/amd64/
            pkg_add cmake gmake lz4 zstd snappy pkgconf
          run: |
            echo "*=====================================*"
            echo " System Information"
            echo "*=====================================*"
            uname -a

            echo ""
            echo "*=====================================*"
            echo " Configure CMake"
            echo "*=====================================*"
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/libdata/pkgconfig
            cmake -S . -B build \
              -DTIDESDB_BUILD_TESTS=ON \
              -DTIDESDB_WITH_SANITIZER=ON

            echo ""
            echo "*=====================================*"
            echo " Build"
            echo "*=====================================*"
            gmake -C build

            echo ""
            echo "*=====================================*"
            echo " Run Tests"
            echo "*=====================================*"
            cd build
            ctest -V --output-on-failure --timeout 5400 --build-config Release

  netbsd-build:
    runs-on: ubuntu-latest
    name: NetBSD 10.1 x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            # NetBSD 10.1's default pkg path (10.1/All) is only a redirect stub pointing at the
            # current quarterly (10.0_2026Q1/All), and pkg_add's fetcher does not follow it -- so the
            # default install fails identically on every rerun. pin PKG_PATH straight at the resolved
            # quarterly dir (verified to hold every dep), trying the Fastly CDN first and the master
            # mirror as a fallback in case an edge returns 503, with a short retry for transient
            # blips. bump the quarterly when 10.0_2026Q1 is eventually pruned.
            ok=0
            for base in \
              "https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/x86_64/10.0_2026Q1/All/" \
              "https://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/x86_64/10.0_2026Q1/All/"; do
              export PKG_PATH="$base"
              for i in 1 2 3; do
                if /usr/sbin/pkg_add cmake lz4 zstd snappy pkgconf gmake; then ok=1; break; fi
                echo "pkg_add from $base attempt $i failed, retrying in $((i*10))s"; sleep $((i*10))
              done
              [ "$ok" = 1 ] && break
            done
            [ "$ok" = 1 ] || { echo "all mirrors failed to provide packages"; exit 1; }
            # TEMPORARY-NETBSD-HANG-PROBE: a debugger to attach to a hung test. base usually
            # ships gdb in the comp set; the package is only the fallback, and best effort
            command -v gdb >/dev/null 2>&1 || /usr/sbin/pkg_add gdb || true
          run: |
            echo "*=====================================*"
            echo " System Information"
            echo "*=====================================*"
            uname -a

            echo ""
            echo "*=====================================*"
            echo " Configure CMake"
            echo "*=====================================*"
            export PKG_CONFIG_PATH=/usr/pkg/lib/pkgconfig
            # no sanitizer here -- ASan does not sit with NetBSD's ASLR and the instrumented
            # binary exits before running a test, so the suite would pass by not running. the
            # build system refuses it on this platform too, so this is belt and braces.
            # TEMPORARY-NETBSD-HANG-PROBE: RelWithDebInfo so a hang's stacks carry function
            # names and lines rather than bare addresses
            cmake -S . -B build \
              -DTIDESDB_BUILD_TESTS=ON \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo

            echo ""
            echo "*=====================================*"
            echo " Build"
            echo "*=====================================*"
            cmake --build build --config Release

            echo ""
            echo "*=====================================*"
            echo " Run Tests"
            echo "*=====================================*"
            cd build

            echo ""
            echo "*=====================================*"
            echo " TEMPORARY: hang probe"
            echo "*=====================================*"
            # TEMPORARY-NETBSD-HANG-PROBE: run the test that intermittently parks forever here,
            # repeatedly, and watch it ourselves rather than through ctest. ctest's timeout kills
            # the process and throws its state away; this attaches gdb first, so a hang prints
            # every thread's stack before anything is killed. gdb writes to a file -- piped into
            # head, SIGPIPE kills gdb and gdb takes the traced process down with it
            PROBE_TEST=test_engine_create_completes_under_sustained_flush
            PROBE_RUNS=25
            PROBE_LIMIT_S=120
            probe_run=1
            while [ "$probe_run" -le "$PROBE_RUNS" ]; do
              rm -rf ./test_engine_db
              ./engine_tests "$PROBE_TEST" > probe.log 2>&1 &
              probe_pid=$!
              probe_s=0
              while kill -0 "$probe_pid" 2>/dev/null && [ "$probe_s" -lt "$PROBE_LIMIT_S" ]; do
                sleep 1
                probe_s=$((probe_s + 1))
              done
              if kill -0 "$probe_pid" 2>/dev/null; then
                echo "HUNG on run $probe_run of $PROBE_RUNS after ${PROBE_LIMIT_S}s -- dumping every thread"
                gdb -p "$probe_pid" -batch \
                  -ex "set pagination off" \
                  -ex "info threads" \
                  -ex "thread apply all bt full" > probe_stacks.txt 2>&1
                echo "----- test output (tail) -----"
                tail -n 60 probe.log
                echo "----- stacks -----"
                cat probe_stacks.txt
                kill -9 "$probe_pid" 2>/dev/null
                exit 1
              fi
              wait "$probe_pid"
              probe_rc=$?
              if [ "$probe_rc" -ne 0 ]; then
                echo "probe run $probe_run failed rc=$probe_rc without hanging"
                tail -n 60 probe.log
                exit 1
              fi
              echo "probe run $probe_run/$PROBE_RUNS passed in ${probe_s}s"
              probe_run=$((probe_run + 1))
            done

            # 300s per test, not the 5400 the other jobs use. nothing here legitimately runs
            # beyond ninety seconds, and this platform has intermittently parked one test for
            # minutes -- at the default a single stall holds the runner for the whole ninety-minute
            # ceiling, so the timeout is what turns that into a prompt failure
            ctest -V --output-on-failure --timeout 300 --build-config Release

  omnios-build:
    runs-on: ubuntu-latest
    name: OmniOS (Illumos) r151054

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on OmniOS (Illumos)
        uses: vmactions/omnios-vm@v1
        with:
          release: "r151054"
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            pkg set-publisher -G '*' -g https://pkg.omnios.org/r151054/extra extra.omnios || true
            pkg install ooce/developer/cmake gcc13 lz4 zstd
          run: |
            echo "*=====================================*"
            echo " System Information"
            echo "*=====================================*"
            uname -a

            echo ""
            echo "*=====================================*"
            echo " Configure CMake"
            echo "*=====================================*"
            export PATH=/opt/ooce/bin:$PATH
            export PKG_CONFIG_PATH=/opt/ooce/lib/pkgconfig
            cmake -S . -B build \
              -DTIDESDB_BUILD_TESTS=ON \
              -DTIDESDB_WITH_SANITIZER=ON

            echo ""
            echo "*=====================================*"
            echo " Build"
            echo "*=====================================*"
            cmake --build build --config Release

            echo ""
            echo "*=====================================*"
            echo " Run Tests"
            echo "*=====================================*"
            cd build
            ctest -V --output-on-failure --timeout 5400 --build-config Release

  dragonflybsd-build:
    runs-on: ubuntu-latest
    name: DragonFlyBSD 6.4.2 x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test on DragonFlyBSD
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: false
          sync: rsync
          copyback: false
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            echo 'Avalon: { enabled: no }' > /usr/local/etc/pkg/repos/df-latest.conf
            echo 'AUTO: { url: "https://pkg.dragonflybsd.org/pkg/$''{ABI}/LATEST", mirror_type: HTTP, enabled: yes }' >> /usr/local/etc/pkg/repos/df-latest.conf
            pkg install -y pkgconf liblz4 zstd snappy
            pkg install -y cmake rsync
          run: |
            echo "*=====================================*"
            echo " System Information"
            echo "*=====================================*"
            uname -a

            echo ""
            echo "*=====================================*"
            echo " Configure CMake"
            echo "*=====================================*"
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/libdata/pkgconfig
            cmake -S . -B build \
              -DTIDESDB_BUILD_TESTS=ON \
              -DTIDESDB_WITH_SANITIZER=ON

            echo ""
            echo "*=====================================*"
            echo " Build"
            echo "*=====================================*"
            cmake --build build --config Release

            echo ""
            echo "*=====================================*"
            echo " Run Tests"
            echo "*=====================================*"
            cd build
            ctest -V --output-on-failure --timeout 5400 --build-config Release
